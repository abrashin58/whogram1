name: Whogram Multiplatform Preview Agent
on: push: branches: [ "main", "dev" ] pull_request: branches: [ "main" ]
jobs: build-and-preview: runs-on: ubuntu-latest
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'temurin'
      java-version: '17'

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v3

  # 1. Сборка Web/Wasm версии для живого превью в браузере
  - name: Build Web Target
    run: ./gradlew :composeApp:wasmJsBrowserDistribution

  # 2. Деплой веб-версии на GitHub Pages для мгновенного доступа
  - name: Deploy to GitHub Pages
    uses: JamesIves/github-pages-deploy-action@v4
    with:
      folder: composeApp/build/dist/wasmJs/productionExecutable
      branch: gh-pages

  # 3. Сборка Android APK для тестирования
  - name: Build Android APK
    run: ./gradlew assembleDebug

  # 4. Агент сохранения артефактов (готовый APK и десктопные бинарники)
  - name: Upload Build Artifacts
    uses: actions/upload-artifact@v4
    with:
      name: whogram-builds
      path: |
        composeApp/build/outputs/apk/debug/composeApp-debug.apk
        composeApp/build/dist/